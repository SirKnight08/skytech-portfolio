<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — SkyTech</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner container">
            <button class="nav-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="brand" href="index.html">
        <span class="brand-mark">SkyTech</span>
        <span class="brand-text">Admin</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="admin.html">Admin</a>
      </div>
      <a class="btn btn-nav" href="contact.html">Logout</a>
    </div>
  </nav>
        <section class="section" style="padding-bottom:80px;">
          <div class="container">
            <div class="glass" style="padding:20px;">
              <h3>Login</h3>
              <label>Username<input id="adminUser" type="text"/></label>
              <label>Password<input id="adminPass" type="password"/></label>
              <button id="adminLogin" class="btn btn-primary">Login</button>
            </div>

            <div id="adminPanel" style="margin-top:20px; display:none;">
              <h3>Contacts</h3>
              <div id="contactsList"></div>

              <hr />
              <h3>Create Project</h3>
              <div class="glass" style="padding:14px;">
                <label>Title<input id="projTitle"/></label>
                <label>Slug<input id="projSlug"/></label>
                <label>Category<input id="projCategory"/></label>
                <label>Description<textarea id="projDesc"></textarea></label>
                <button id="createProj" class="btn btn-secondary">Create Project</button>
              </div>
              <h3 style="margin-top:18px;">Projects</h3>
              <div id="projectsList"></div>
            </div>
          </div>
        </section>

  <main>
    <section class="section hero">
      <div class="container">
        <p class="section-label">Admin</p>
        <h1>Admin Dashboard (placeholder)</h1>
        <p class="section-copy">Secure admin UI will be implemented in Phase 2 with authentication and data management.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <span class="footer-brand">SkyTech</span>
      </div>
      <div class="footer-actions">
        <p>&copy; 2026 SkyTech</p>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
  <script>
    async function api(path, opts={}){
      const res = await fetch(path, opts);
      return res.json();
    }
    document.getElementById('adminLogin').addEventListener('click', async ()=>{
      const username = document.getElementById('adminUser').value.trim();
      const password = document.getElementById('adminPass').value.trim();
      const r = await api('/api/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username,password})});
      if (r.token) {
        localStorage.setItem('skytech_admin_token', r.token);
        document.getElementById('adminPanel').style.display = 'block';
        loadContacts();
      } else {
        alert(r.error || 'Login failed');
      }
    });

    async function loadContacts(){
      const token = localStorage.getItem('skytech_admin_token');
      const r = await fetch('/api/admin/contacts', { headers: { Authorization: `Bearer ${token}` }});
      const data = await r.json();
      const list = document.getElementById('contactsList');
      list.innerHTML = '';
      (data.data || []).forEach(c => {
        const d = document.createElement('div');
        d.className = 'glass';
        d.style.padding='12px';
        d.style.marginBottom='12px';
        d.innerHTML = `<strong>${c.name}</strong> <small>${c.email}</small><div>${c.message || ''}</div>`;
        list.appendChild(d);
      });
      loadProjects();
    }

    async function loadProjects(){
      const token = localStorage.getItem('skytech_admin_token');
      const r = await fetch('/api/projects');
      const data = await r.json();
      const list = document.getElementById('projectsList');
      list.innerHTML = '';
      (data.data || []).forEach(p => {
        const d = document.createElement('div');
        d.className = 'glass';
        d.style.padding='12px';
        d.style.marginBottom='12px';
        d.innerHTML = `<strong>${p.title}</strong> <small>${p.category||''}</small><div>${(p.description||'').slice(0,200)}</div>`;
        list.appendChild(d);
      });
    }

    document.getElementById('createProj').addEventListener('click', async ()=>{
      const title = document.getElementById('projTitle').value.trim();
      const slug = document.getElementById('projSlug').value.trim();
      const category = document.getElementById('projCategory').value.trim();
      const description = document.getElementById('projDesc').value.trim();
      const token = localStorage.getItem('skytech_admin_token');
      const r = await fetch('/api/admin/projects', { method: 'POST', headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` }, body: JSON.stringify({ title, slug, category, description }) });
      const res = await r.json();
      if (res.data) { loadProjects(); }
    });
  </script>
</body>
</html>
